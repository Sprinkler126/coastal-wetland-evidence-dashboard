name: Deploy static dashboard to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate localization and data contracts
        run: |
          node scripts/test-i18n.mjs
          node scripts/test-data-contracts.mjs
          for file in web/web/js/*.js scripts/*.mjs; do node --check "$file"; done

      - name: Verify Pages artifact
        run: |
          test -f web/web/index.html
          test -f web/web/.nojekyll
          test -f web/web/vendor/echarts.min.js
          test -f web/web/data/manifest.json
          test -f web/web/data/evidence_bundle.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
